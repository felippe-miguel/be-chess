services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:8080
    ports:
      # Porta do host configuravel via API_PORT, para evitar conflito com
      # outros projetos que ja usem a 3000 nesta maquina.
      - '${API_PORT:-3000}:3000'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
