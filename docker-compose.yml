services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:8080
    ports:
      # Porta do host configuravel via API_PORT. O default e 3100 porque a
      # 3000 ja e usada por outro projeto nesta maquina. Dentro da rede do
      # compose a api continua escutando na 3000, e o nginx do servico web
      # faz proxy para api:3000 - trocar a porta do host nao afeta isso.
      - '${API_PORT:-3100}:3000'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
